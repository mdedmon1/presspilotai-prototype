<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PressPilot AI - Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🚨 Breaking Feed</h1>
  </header>
  <section class="alert">
    <p><strong>ALERT:</strong> Category 4 Hurricane has made landfall in coastal Georgia.</p>
    <button onclick="assignTask()">Assign Field Team</button>
  </section>
  <section class="editorial">
    <h2>Suggested Angles</h2>
    <ul>
      <li>FEMA Response Timeline</li>
      <li>Infrastructure Collapse</li>
      <li>Climate Policy Reactions</li>
    </ul>
  </section>
  <section class="assignment">
    <h2>Assignment Tracker</h2>
    <p id="status">Status: Waiting for assignment...</p>
  </section>
  <script src="script.js"></script>
</body>
</html>
